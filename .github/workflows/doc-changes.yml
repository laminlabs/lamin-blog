name: doc-changes

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

jobs:
  doc-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "laminci[doc-changes]@git+https://github.com/laminlabs/laminci"
      - run: laminci doc-changes
        env:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          docs_token: ${{ secrets.LAMIN_BUILD_DOCS }}
          changelog_file: lamin-docs/docs/changelog/soon/blog.md
      - name: Dispatch changelog merge in lamin-docs
        if: github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.LAMIN_BUILD_DOCS }}
          PUBLISHED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/laminlabs/lamin-docs/dispatches \
            -d "{\"event_type\":\"lamin-blog-dispatch\",\"client_payload\":{\"published_at\":\"${PUBLISHED_AT}\"}}"
